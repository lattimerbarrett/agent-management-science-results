# Tool definitions for the single-file scratchpad harness.
# Loaded by the Scratchpad class in scratchpad.py, which checks them against the handler signatures at
# import (see toolkit.py).
#
# Descriptions use `>-` (folded, no trailing newline): wrapped lines are joined with spaces,
# and a blank line starts a new paragraph. Use `|` instead if a description needs exact
# line breaks (e.g. a code example).
#
# The scratchpad filename is hardcoded here; keep it in sync with FILENAME in scratchpad.py.

- name: read_scratchpad
  description: >-
    Read the scratchpad file (scratchpad.py). Returns its contents with each line
    prefixed by its line number and a tab. The prefix is for reference only and
    is not part of the file: never include it in edit_scratchpad's old_string.
    You must read the file before editing or overwriting it whenever you have not
    seen its current contents. For long files, use start_line/end_line.
  input_schema:
    type: object
    properties:
      start_line:
        type: integer
        minimum: 1
        description: First line to return (1-indexed). Defaults to 1.
      end_line:
        type: integer
        minimum: 1
        description: Last line to return, inclusive. Defaults to end of file.

- name: write_scratchpad
  description: >-
    Replace the entire contents of scratchpad.py with `content`. Use this to create
    the script or for full rewrites. For changes to existing code, prefer
    edit_scratchpad, which is cheaper and less error-prone. Rejected if the file
    has changed since you last read or wrote it.
  input_schema:
    type: object
    properties:
      content:
        type: string
        description: The complete new file contents.
    required: [content]

- name: edit_scratchpad
  description: >-
    Replace an exact string in scratchpad.py. old_string must match the file
    exactly, including whitespace and indentation, and must occur exactly once
    unless replace_all is true. If it matches zero or several times, the edit is
    rejected and the file is unchanged; include more surrounding lines to make it
    unique. Do not include line-number prefixes from read_scratchpad. Rejected if
    the file has changed since you last read it.
  input_schema:
    type: object
    properties:
      old_string:
        type: string
        description: Exact text to replace.
      new_string:
        type: string
        description: Replacement text (must differ from old_string).
      replace_all:
        type: boolean
        description: Replace every occurrence instead of requiring a unique match. Default false.
    required: [old_string, new_string]

- name: run_scratchpad
  description: >-
    Execute scratchpad.py in a fresh Python process and return the exit code, wall
    time, stdout, and stderr. With content, the file is first replaced by it (as
    write_scratchpad does); without, the file runs as it is. Nothing in memory
    persists between runs: every run
    starts from a clean interpreter, so the script must recompute or reload
    anything it needs. To reuse expensive results across runs, write them to disk
    (e.g. pickle or JSON) next to the script and load them if present. Long output
    is truncated in the middle; tracebacks appear at the end of stderr. The process
    has no network access and cannot start other programs, and it is killed after
    timeout_seconds or if it uses too much memory; a timeout reports the line it
    was at.
  input_schema:
    type: object
    properties:
      content:
        type: string
        description: New contents for scratchpad.py, written before the run. Omit to run the file as it is.
      timeout_seconds:
        type: integer
        minimum: 1
        maximum: 120
        description: Kill the run after this many seconds (at most 120). Default 60.