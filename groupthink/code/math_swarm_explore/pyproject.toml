[project]
name = "mathswarm"
version = "0.1.0"
description = "Swarms of local agents on the math and logic problems of Self-Organizing Agent Teams: does collaboration emerge, and can opinion stay diverse without belief collapse?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "swarm-engine",                      # ../swarm_engine: every model call goes through it
    "math-verify[antlr4-13-2]>=0.9.0",   # the paper's answer checker
    "matplotlib>=3.11",
    "numpy>=2.5",
    "sympy>=1.14",                       # with numpy, what agents' Python files may import (mathswarm/python.py)
    "pyarrow>=25.0.1",                   # the benchmarks come as parquet
]

[project.scripts]
lab = "mathswarm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
swarm-engine = { path = "../swarm_engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
